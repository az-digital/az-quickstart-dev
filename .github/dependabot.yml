version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "php"
      - "3.x only"
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "1.x"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "php"
      - "1.x only"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: main
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "github_actions"
      - "ci"
      - "3.x only"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "1.x"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
      - "github_actions"
      - "ci"
      - "1.x only"
