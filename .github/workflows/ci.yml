  # qs-main:
  #   name: Quickstart main
  #   uses: az-digital/az_quickstart/.github/workflows/ci-reusable.yml@main
  #   permissions:
  #     contents: read
  #     checks: write
  #     pull-requests: read
  #   with:
  #     composer-audit: false
  #     eslint: false
  #     yarn-audit: false
  #
  # qs-3-6:
  #   name: Quickstart 3.6.x
  #   uses: az-digital/az_quickstart/.github/workflows/ci-reusable.yml@3.6.x
  #   permissions:
  #     contents: read
  #     checks: write
  #     pull-requests: read
  #   with:
  #     quickstart-ref: 3.6.x
  #     composer-validate: false
  #     phpunit: false
